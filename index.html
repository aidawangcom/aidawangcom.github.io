<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的网站</title>
</head>
<body>
    <h1>🎉 成功啦！</h1>
    <p>我的第一个 GitHub Pages 网站</p>
    <p>你是第 <span id="count">加载中...</span> 位访客</p>
    <script>
        // 后端地址稍后填入
        const WORKER_URL = 'https://visit-counter.18032721531.workers.dev';
        fetch(WORKER_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('count').innerText = data.visits;
            })
            .catch(() => {
                document.getElementById('count').innerText = '无法连接';
            });
    </script>
</body>
</html>
